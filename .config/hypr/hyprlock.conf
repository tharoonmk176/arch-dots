# Generated by theme-preset-switcher.sh

background {
    path = $HOME/.config/hypr/current_wallpaper
    blur_size = 8
    blur_passes = 4
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.28
    vibrancy_darkness = 0.15
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.45
    dots_center = true
    outer_color = rgb(56, 160, 216)
    inner_color = rgb(22, 34, 46)
    font_color = rgb(200, 216, 232)
    fade_on_empty = true
    placeholder_text = Enter password
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%H:%M'
    color = rgb(200, 216, 232)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%A · %d %B'
    color = rgb(80, 192, 160)
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(whoami)@$(hostname -s)"
    color = rgb(128, 136, 208)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null || echo '—')%"
    color = rgb(80, 192, 160)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}
